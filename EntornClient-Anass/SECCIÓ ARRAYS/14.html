<body>
    <h3>14. Manipulació de matrius</h3>
    <script>
        const matriu = [ [1, 2, 3], [4, 5, 6], [7, 8, 9] ];

        let enUnaLinia = matriu.flat().join(" ");
        console.log(enUnaLinia);

        let sumaTotal = 0;

        for (let num of matriu.flat()) {
        sumaTotal += num;
        }   

        console.log(`La suma total és: ${sumaTotal}`);

    </script>
</body>
