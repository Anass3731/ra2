<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h3>15. Llista de tasques</h3>
    <script>
        const tasques = [ { nom: "Fer deures", completada: true }, 
                        { nom: "Estudiar Angular", completada: false }, 
                        { nom: "Practicar JS", completada: true } ];



            let pendents = tasques.filter(t => !t.completada);

            console.log("--- TASQUES PENDENTS ---");
            console.log(pendents);

            let numCompletades = tasques.filter(t => t.completada).length;
            let numPendents = pendents.length;

            console.log(`Completades: ${numCompletades} | Pendents: ${numPendents}`);
        
    </script>
</body>
</html>
