<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>2. Dia de la setmana</h1>
    <script>
        let dia = parseInt(prompt("Que dia de la semana estamos? (1=Lunes, 2=Martes... 7=Domingo)"));

        switch (dia) {
            case 1:
                alert("Lunes");
                break;
            case 2:
                alert("Martes");
                break;
            case 3:
                alert("Miercoles");
                break;
            case 4:
                alert("Jueves");
                break;
            case 5:
                alert("Viernes");
                break;
            case 6:
                alert("Sabado");
                break;
            case 7:
                alert("Domningo");
                break;
   
            default:
                alert("numero incorrecto solo del 1 al 7")
                break;
        }

    </script>
</body>
</html>
