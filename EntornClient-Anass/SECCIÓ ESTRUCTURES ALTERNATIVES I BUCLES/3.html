<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>3. Taula de multiplicar</h1>
    <script>
        let numero = parseInt(prompt("Dime un numero"));
        
        for (let i = 1; i<=10; i++) {
            let multi = numero * i;
            alert(numero + "x" + i + "="+ multi );
        }
    </script>
</body>
</html>
