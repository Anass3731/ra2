    <h3>18. Neteja d'strings</h3>
    <script>
   const usuaris = [" maria ", "JOAN", "Pere", " lAIA", "julia "];

    function netejaUsuaris(llista) {
        return llista.map(function(nom) {
            let limpio = nom.trim().toLowerCase();
            return limpio[0].toUpperCase() + limpio.slice(1);
        });
    }

    console.log(netejaUsuaris(usuaris));


    
const netejaUsuarisAnonima = function(llista) {
    return llista.map(function(nom) {
        let limpio = nom.trim().toLowerCase();
        return limpio[0].toUpperCase() + limpio.slice(1);
    });
};

console.log(netejaUsuarisAnonima(usuaris));

    let net = nom.trim().toLowerCase();

});
