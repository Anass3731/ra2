<body>
    <h1>10. Nom complet</h1>
    <h6>Demana un nom complet (nom i cognom) i mostra per separat: el nom i el cognom</h6>
    <script>

    let persona = prompt("Pon tu nombre y apellido");
    let part = persona.split(" ");

    alert("Nombre -> " + part[0]);
    alert("Apellido -> " + part[1]);

    </script>
</body>
