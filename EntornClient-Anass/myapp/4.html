<body>
    <h1>4. Suma de números fins a N</h1>
    <script>

        let n = parseInt(prompt("Dime un numero"));

        let sum = 0;
        let contador = 1;

        while (contador<=n) {
            sum = sum + contador;
            contador++;
    
        }
           alert("La suma de 1 fins a " + n + " és: " + sum);
    </script>
    
</body>
